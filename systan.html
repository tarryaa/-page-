<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>システム英単語</title>
<link rel="manifest" href="manifest-sys.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="シス単">
<meta name="theme-color" content="#0b0d10">
<link rel="apple-touch-icon" href="icon-sys-180.png">
<link rel="icon" href="icon-sys-180.png">
<script>(function(){try{var t=localStorage.getItem('sys.theme')||'dark';document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','dark');}})();</script>
<style>
:root{--hide-bg:#cbd5e1;--hide-rv:#eef2ff;--mine-bg:#f3e8ff;--mine-fg:#7e22ce;--bg:#f6f7f9;--panel:#fff;--text:#1c2430;--muted:#6b7683;--border:#e3e7ec;--accent:#059669;--accent-soft:#e7f7f0;--mark:#fff2a8;--star:#eab308;--miss:#dc2626;--idiom-bg:#e8f0ff;--idiom-fg:#1d4ed8;--kobun-bg:#fff2e0;--kobun-fg:#b45309;--num-bg:#eef1f5;--num-fg:#475569;--shin-bg:#dcfce7;--shin-fg:#15803d;}
:root[data-theme="dark"]{--hide-bg:#3b4554;--hide-rv:#1e2633;--mine-bg:#2e1a47;--mine-fg:#d8b4fe;--bg:#0b0d10;--panel:#14181d;--text:#e6ebf2;--muted:#9aa6b4;--border:#262c34;--accent:#34d399;--accent-soft:#12281f;--mark:#5c5015;--star:#fbbf24;--miss:#f87171;--idiom-bg:#16263f;--idiom-fg:#8fbcff;--kobun-bg:#33260f;--kobun-fg:#f0b968;--num-bg:#222c38;--num-fg:#aab6c4;--shin-bg:#14331f;--shin-fg:#6ee7a0;}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; overflow:hidden; overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Segoe UI",sans-serif;
  background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  position:fixed; top:0; left:0; right:0; bottom:0; -webkit-text-size-adjust:100%}
header{background:var(--panel); border-bottom:1px solid var(--border); z-index:5;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  padding-left:calc(12px + env(safe-area-inset-left)); padding-right:calc(12px + env(safe-area-inset-right))}
.top{display:flex; align-items:center; gap:8px}
h1{font-size:17px; margin:0; white-space:nowrap}
.sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.spacer{flex:1}
.ib{border:1.5px solid var(--border); background:var(--panel); color:var(--text);
  width:38px; height:36px; border-radius:10px; font-size:16px; line-height:1; flex:none}
.searchwrap{position:relative; margin-top:8px}
#q{width:100%; font-size:16px; padding:11px 38px 11px 36px; border:1.5px solid var(--border);
  border-radius:11px; background:var(--bg); color:var(--text); outline:none; -webkit-appearance:none}
#q:focus{border-color:var(--accent); background:var(--panel)}
.ico{position:absolute; top:50%; left:12px; transform:translateY(-50%); color:var(--muted); font-size:15px}
#clear{position:absolute; top:50%; right:5px; transform:translateY(-50%); border:none; background:transparent;
  color:var(--muted); font-size:20px; width:32px; height:32px; border-radius:50%; display:none}
.chips{display:flex; gap:6px; margin-top:8px; overflow-x:auto; padding-bottom:2px;
  scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1.5px solid var(--border); background:var(--panel); color:var(--muted); flex:none;
  padding:7px 13px; border-radius:20px; font-size:13px; font-weight:600; white-space:nowrap}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff}
#markbtn.active{background:var(--star); border-color:var(--star); color:#3a2c00}
select.chip{padding:7px 10px; max-width:150px; -webkit-appearance:none; text-align:center}
#gsel{max-width:170px; overflow:hidden; text-overflow:ellipsis}
.sheet.tall{height:92%}
.gsrow{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:transparent;
  border:none; border-bottom:1px solid var(--border); color:var(--text); padding:13px 6px;
  font-size:15px; font-family:inherit; touch-action:manipulation}
.gsrow.on{background:var(--accent-soft); color:var(--accent); font-weight:700}
.gsrow.on .gsnm::after{content:"  ✓"}
.gsrow.fixed{color:var(--muted); font-weight:600}
.gsrow.fixed.on{color:var(--accent)}
.gsnm{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.gspath{display:none; color:var(--muted); font-weight:400; font-size:13px}
.searching .gsrow:not(.fixed){padding-left:6px !important}
.searching .gspath{display:inline}
.statusline{display:flex; align-items:center; gap:8px; margin-top:7px; font-size:12px; color:var(--muted)}
.statusline b{color:var(--text)}
main{flex:1; overflow-y:auto;
  padding:8px 10px calc(24px + env(safe-area-inset-bottom));
  padding-left:calc(10px + env(safe-area-inset-left)); padding-right:calc(10px + env(safe-area-inset-right))}
.card{background:var(--panel); border:1px solid var(--border); border-radius:10px;
  padding:4px 8px 4px 10px; margin-bottom:6px}
.r1{display:flex; align-items:center; gap:6px; min-height:26px}
.r2{display:flex; align-items:center; gap:6px; min-height:28px}
.badge{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:5px; white-space:nowrap; flex:none}
.badge.熟語{background:var(--idiom-bg); color:var(--idiom-fg)}
.badge.構文{background:var(--kobun-bg); color:var(--kobun-fg)}
.badge.num{background:var(--num-bg); color:var(--num-fg)}
.badge.自作{background:var(--mine-bg); color:var(--mine-fg); cursor:pointer}
.hid{color:transparent !important; background:var(--hide-bg); border-radius:4px; cursor:pointer;
  -webkit-box-decoration-break:clone; box-decoration-break:clone; -webkit-user-select:none; user-select:none}
.hid mark{background:transparent !important; color:transparent !important}
.hid.rv{color:inherit !important; background:var(--hide-rv)}
.hid.rv mark{background:var(--mark) !important; color:inherit !important}
.mk-hint{font-size:12.5px; color:var(--muted); border:1px dashed var(--border); border-radius:9px;
  padding:8px 10px; margin-bottom:10px; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mk-modes{display:flex; gap:6px; margin-bottom:6px}
.mk-note{font-size:12px; color:var(--muted); margin:4px 0 6px; line-height:1.6}
.mk-lab{font-size:11.5px; color:var(--muted); margin:12px 0 5px}
.mk-line{display:flex; flex-wrap:wrap; align-items:center; row-gap:8px; padding:10px; border:1px solid var(--border);
  border-radius:10px; background:var(--bg); touch-action:none; -webkit-user-select:none; user-select:none;
  font-size:18px; line-height:1.6}
.mk-line .mt{padding:4px 8px; margin:0 2px; border-radius:7px; border:1px solid var(--border); background:var(--panel)}
.mk-line.ch .mt{padding:4px 3px; margin:0; border-color:transparent; background:transparent; min-width:.7em; text-align:center}
.mk-line .mt.on{background:var(--hide-bg); border-color:var(--hide-bg); color:var(--muted)}
.mk-line .mt.part{box-shadow:inset 0 -4px 0 var(--hide-bg)}
.mk-line .mt.drag{outline:2px solid var(--accent); outline-offset:-1px}
.mk-line .msp{white-space:pre; color:var(--muted)}
.mk-pv{padding:10px; border:1px solid var(--border); border-radius:10px; font-size:15px; line-height:1.7; white-space:pre-wrap}
.mk-pv-en{font-weight:700; font-size:16px}
.mk-nav{display:flex; gap:8px}
.mk-nav .gbtn{flex:1; padding:11px 6px; font-size:14px}
.gbtn.danger{border-color:var(--miss); color:var(--miss)}
.shin{font-size:9.5px; font-weight:700; padding:0 5px; border-radius:4px; flex:none;
  background:var(--shin-bg); color:var(--shin-fg)}
.gdots{display:flex; gap:2px; flex:none}
.gdot{width:7px; height:7px; border-radius:50%; display:inline-block}
.spk{border:none; background:transparent; color:var(--muted); width:30px; height:26px; padding:0;
  border-radius:7px; flex:none; display:inline-flex; align-items:center; justify-content:center; margin:0 -2px}
.spk svg{pointer-events:none}
.spk.on{color:var(--accent); background:var(--accent-soft)}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:rgba(20,24,30,.96); color:#fff; padding:11px 14px; border-radius:11px; font-size:13px;
  line-height:1.55; width:max-content; max-width:88%; z-index:90; opacity:0; pointer-events:none; transition:opacity .2s}
.toast.show{opacity:1}
.tts-row{padding:12px 2px; border-bottom:1px solid var(--border)}
.tts-lab{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:8px}
.tts-lab b{color:var(--accent); font-variant-numeric:tabular-nums}
.tts-row input[type=range]{width:100%; accent-color:var(--accent); height:28px}
.tts-sel{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:10px; font-size:15px}
.star{border:none; background:transparent; color:var(--muted); font-size:19px; width:30px; height:26px;
  margin:0 -4px 0 0; line-height:1; flex:none}
.star.on{color:var(--star)}
.en{font-size:15.5px; font-weight:700; line-height:1.2; flex:1; min-width:0; word-break:break-word}
.jp{font-size:12.5px; color:var(--text); line-height:1.3; flex:1; min-width:0; word-break:break-word; white-space:pre-wrap}
.ms{display:inline-flex; align-items:center; gap:4px; flex:none}
.ms button{border:1px solid var(--border); background:var(--panel); color:var(--muted);
  height:26px; min-width:30px; border-radius:7px; font-size:14px; line-height:1; padding:0}
.ms button:disabled{opacity:.3}
.ms .cnt{min-width:32px; font-weight:700; font-size:13.5px}
.ms .cnt.has{color:var(--miss); border-color:var(--miss)}
.gp{border:1px solid var(--border); background:var(--panel); color:var(--muted); flex:none;
  height:26px; padding:0 9px; border-radius:7px; font-size:12px}
mark{background:var(--mark); color:inherit; border-radius:3px; padding:0 1px}
.empty{text-align:center; color:var(--muted); padding:50px 20px; font-size:15px; line-height:1.7}
.sent{height:1px}
/* ---- シート（ダイアログ） ---- */
.ovl{position:fixed; left:0; top:0; width:100%; height:100dvh; background:rgba(0,0,0,.5);
  display:none; z-index:50; align-items:flex-end; touch-action:manipulation}
.ovl.open{display:flex}
.sheet{background:var(--panel); width:100%; max-height:92%; border-radius:16px 16px 0 0;
  display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom)}
.sh-h{display:flex; align-items:flex-start; gap:10px; padding:14px 16px 10px; border-bottom:1px solid var(--border)}
.sh-h .tt{flex:1; min-width:0}
.sh-t{font-size:16px; font-weight:700; display:block; word-break:break-word}
.sh-s{font-size:12px; color:var(--muted); display:block; margin-top:3px}
.sh-x{border:none; background:transparent; color:var(--muted); font-size:24px; width:36px; height:36px;
  border-radius:9px; flex:none}
.sh-b{padding:12px 16px 16px; overflow-y:auto; overscroll-behavior:contain}
.mi{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:14px 4px;
  border:none; border-bottom:1px solid var(--border); background:transparent; color:var(--text); font-size:15px}
.gchk{display:flex; align-items:center; gap:10px; padding:13px 4px; border-bottom:1px solid var(--border);
  font-size:15px; touch-action:manipulation}
.gchk .cb{width:24px; height:24px; border:2px solid var(--border); border-radius:6px; flex:none;
  display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff}
.gchk.on .cb{background:var(--accent); border-color:var(--accent)}
.gchk .gnm{flex:1; min-width:0}
.gpar{background:var(--bg); border:1px solid var(--border); color:var(--muted); border-radius:7px;
  padding:7px 5px; font-size:12px; max-width:92px; flex:none}
.ed{border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:12px; background:var(--bg)}
.edlab{font-size:11.5px; color:var(--muted); margin-bottom:5px}
.ed textarea{width:100%; min-height:0; background:var(--panel); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:9px; font-size:16px; line-height:1.5;
  resize:none; overflow:hidden; font-family:inherit; display:block}
.edrow{display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap}
.edmsg{font-size:12px; color:var(--accent)}
.edorig{font-size:11.5px; color:var(--muted); margin-top:4px}
.gcount{margin-left:auto; color:var(--muted); font-size:12px}
.gm-row{display:flex; align-items:center; gap:7px; padding:9px 0; border-bottom:1px solid var(--border)}
.gm-row input[type=text]{flex:1; min-width:0; background:var(--bg); border:1px solid var(--border);
  color:var(--text); border-radius:8px; padding:8px; font-size:16px}
.gm-colors{display:flex; gap:3px; flex-wrap:wrap; width:74px}
.gm-c{width:16px; height:16px; border-radius:50%; border:2px solid transparent}
.gm-c.on{border-color:var(--text)}
.gbar{display:flex; gap:6px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border)}
.gbar .nm{flex:1; min-width:0; display:flex; align-items:center; gap:7px; font-size:14px}
.gbtn{border:1px solid var(--border); background:var(--panel); color:var(--muted);
  padding:7px 12px; border-radius:8px; font-size:13px; white-space:nowrap}
.dl-x{border:none; background:transparent; color:var(--muted); font-size:18px; width:34px; height:34px; border-radius:8px}
.sh-b{flex:1; min-height:0}
.sh-f{background:var(--panel); border-top:1px solid var(--border); padding:10px 16px 12px}
.sh-f:empty{display:none}
.sh-act{padding:0}
.sh-act input[type=text]{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:11px; font-size:16px; margin-bottom:8px}
.big{width:100%; border:1.5px solid var(--accent); background:transparent; color:var(--accent);
  padding:12px; border-radius:10px; font-size:15px; font-weight:700}
.big.solid{background:var(--accent); color:#fff}
.big.warn{border-color:var(--miss); color:var(--miss)}
.sh-top{background:var(--panel); padding:10px 16px 0}
.sh-top:empty{display:none}
.ghead{padding:0; margin:0}
.gfil{width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:9px; padding:9px; font-size:16px; margin-bottom:8px}
.hist{list-style:none; margin:0; padding:0}
.hist li{display:flex; align-items:center; gap:8px; padding:10px 2px; border-bottom:1px solid var(--border); font-size:14px}
.hist li span{flex:1}
textarea{width:100%; min-height:150px; background:var(--bg); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:10px; font-size:16px; font-family:ui-monospace,Menlo,monospace}
.note{font-size:12.5px; color:var(--muted); line-height:1.75; margin:8px 0}
.note code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:5px}
.htab td{padding:3px 10px 3px 0; vertical-align:top; font-size:12.5px; line-height:1.7}
.htab code{background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:5px; font-size:11.5px}

</style>
</head>
<body>
<header>
  <div class="top">
    <h1>システム英単語</h1>
    <span class="sub" id="sub"></span>
    <span class="spacer"></span>
    <button class="ib" id="theme">🌙</button>
    <button class="ib" id="menu">⋯</button>
  </div>
  <div class="searchwrap">
    <span class="ico">🔍</span>
    <input id="q" type="search" autocomplete="off" autocapitalize="none" placeholder="re- -tion / 5文字 / 間違いあり">
    <button id="clear">×</button>
  </div>
  <div class="chips">
    <button class="chip active" data-f="all">すべて</button><button class="chip" data-f="shin">新</button><button class="chip" data-f="自作">自作</button>
    <button class="chip" id="markbtn">★のみ</button>
    <button class="chip" id="andbtn">順不同 OFF</button>
    <button class="chip" id="hidejp">訳を隠す</button>
    <button class="chip" id="hideen">英語を隠す</button>
    <button class="chip" id="hidepart">部分を隠す</button>
    <button class="chip" id="gsel">組：全部 ▾</button>
    <button class="chip" id="gbulk">一括</button>
    <button class="chip" id="gmgr">組の管理</button>
    <select class="chip" id="sort">
      <option value="def">番号↑</option>
      <option value="numdesc">番号↓</option>
      <option value="missdesc">間違い多い順</option>
      <option value="missasc">間違い少ない順</option>
    </select>
  </div>
  <div class="statusline"><span id="count"></span></div>
</header>
<main id="main">
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">該当する項目がありません</div>
</main>
<div class="ovl" id="ovl">
  <div class="sheet">
    <div class="sh-h"><span class="tt"><span class="sh-t" id="sh-t"></span><span class="sh-s" id="sh-s"></span></span>
      <button class="sh-x" id="sh-x">×</button></div>
    <div class="sh-top" id="sh-top"></div>
    <div class="sh-b" id="sh-b"></div>
    <div class="sh-f" id="sh-f"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
var NS='sys', KIND='sys', TITLE='システム英単語', IS_SOKU=false, IMPORTNAME='sys-backup.json';

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function normWord(w){return w.replace(/^[^A-Za-z0-9']+|[^A-Za-z0-9']+$/g,'').toLowerCase();}

/* 末尾/先頭の飾り（～ ... （…） 〔…〕 句読点）を段階的に外した候補を作る */
function variants(s){
  var out=[], seen={}, t=String(s).trim();
  function push(x){ x=x.trim(); if(x && !seen[x]){ seen[x]=1; out.push(x.toLowerCase()); } }
  push(t);
  var cur=t;
  for(var k=0;k<8;k++){
    var n=cur;
    n=n.replace(/\s*[〔【\[][^〕】\]]*[〕】\]]\s*$/,'');
    n=n.replace(/\s*[（(][^）)]*[)）]\s*$/,'');
    n=n.replace(/[\s,、，]*\.\.\.$/,'');
    n=n.replace(/[\s,、，]*[～~]$/,'');
    n=n.replace(/[\s.,、，;；:：?？!！]+$/,'');
    n=n.trim();
    if(n===cur) break;
    cur=n; push(cur);
  }
  var lead=[];
  for(var i=0;i<out.length;i++){
    var L=out[i].replace(/^[\s～~,、，]+/,'').trim();
    if(L && L!==out[i]) lead.push(L);
  }
  for(var j=0;j<lead.length;j++) push(lead[j]);
  return out;
}

var QUOTE_RE=/^["'\u201C\u201D\u300C\u300E\u2018\u2019](.+)["'\u201C\u201D\u300D\u300F\u2018\u2019]$/;
var LEN_RE=/^([0-9]+)(?:[-~\u301C\uFF5E]([0-9]+))?(?:文字|字)$/;
var WC_RE=/^([0-9]+)(?:[-~\u301C\uFF5E]([0-9]+))?語$/;
var NRANGE_RE=/^([0-9]+)[-~\u301C\uFF5E]([0-9]+)$/;
var NLE_RE=/^([0-9]+)(?:以下|まで)$/;
var NGE_RE=/^([0-9]+)(?:以上|から)$/;
var MISS_RE=/^(?:間違い|間違え|まちがい|ミス|✗|×)\s*([0-9]+)(?:[-~\u301C\uFF5E]([0-9]+))?(以上|以下)?$/;
var MISSANY_RE=/^(?:間違い|間違え|まちがい|ミス|✗|×)\s*(あり|なし)$/;
var INF=1e9;

function classify(t){
  var m;
  if((m=t.match(MISSANY_RE))) return m[1]==='あり' ? {k:'miss',a:1,b:INF} : {k:'miss',a:0,b:0};
  if((m=t.match(MISS_RE))){
    var a=+m[1];
    if(m[2]) return {k:'miss', a:a, b:+m[2]};
    if(m[3]==='以上') return {k:'miss', a:a, b:INF};
    if(m[3]==='以下') return {k:'miss', a:0, b:a};
    return {k:'miss', a:a, b:a};
  }
  if((m=t.match(NRANGE_RE))) return {k:'nrange', a:+m[1], b:+m[2]};
  if((m=t.match(NLE_RE)))    return {k:'nrange', a:0,     b:+m[1]};
  if((m=t.match(NGE_RE)))    return {k:'nrange', a:+m[1], b:INF};
  if((m=t.match(LEN_RE)))    return {k:'len', a:+m[1], b:m[2]?+m[2]:+m[1]};
  if((m=t.match(WC_RE)))     return {k:'wc',  a:+m[1], b:m[2]?+m[2]:+m[1]};
  if((m=t.match(QUOTE_RE)))  return {k:'word', v:m[1].trim().toLowerCase()};
  if(t.length>1 && t.charAt(t.length-1)==='-') return {k:'pre', v:t.slice(0,-1).toLowerCase()};
  if(t.length>1 && t.charAt(0)==='-')          return {k:'suf', v:t.slice(1).toLowerCase()};
  return null;
}

function parseQuery(raw, andMode){
  var toks=raw.split(/\s+/).filter(Boolean);
  if(!toks.length) return {type:'empty'};
  if(toks.length===1 && /^[0-9]+$/.test(toks[0])) return {type:'num', n:parseInt(toks[0],10)};
  var cls=toks.map(classify);
  var hasSpecial=cls.some(function(c){return !!c;});
  var hasNum=toks.some(function(t){return /^[0-9]+$/.test(t);});
  if(!hasSpecial && hasNum && toks.length>=2) return {type:'pos', toks:toks};

  var terms=[], pending=[];
  function flush(){
    if(!pending.length) return;
    if(andMode){ for(var i=0;i<pending.length;i++) terms.push({k:'has', v:pending[i].toLowerCase()}); }
    else terms.push({k:'has', v:pending.join(' ').toLowerCase()});
    pending=[];
  }
  for(var i=0;i<toks.length;i++){
    var c=cls[i];
    if(!c){ pending.push(toks[i]); continue; }
    if(c.k==='pre'){
      var v=(pending.length? pending.join(' ')+' '+c.v : c.v).toLowerCase();
      pending=[]; terms.push({k:'pre', v:v}); continue;
    }
    if(c.k==='suf'){
      flush();
      var parts=[c.v];
      while(i+1<toks.length && !cls[i+1] && !/^[0-9]+$/.test(toks[i+1])) parts.push(toks[++i].toLowerCase());
      terms.push({k:'suf', v:parts.join(' ')}); continue;
    }
    flush(); terms.push(c);
  }
  flush();
  return {type:'terms', terms:terms};
}

function anyStarts(list, v){ for(var i=0;i<list.length;i++) if(list[i].lastIndexOf(v,0)===0) return true; return false; }
function anyEnds(list, v){
  for(var i=0;i<list.length;i++){ var s=list[i];
    if(s.length>=v.length && s.indexOf(v, s.length-v.length)===s.length-v.length) return true; }
  return false;
}

function matchEntry(r, raw, andMode){
  var q=parseQuery(raw, andMode);
  if(q.type==='empty') return {ok:true, needles:[]};
  if(q.type==='num')   return {ok:(r.no===q.n), needles:[]};
  if(q.type==='pos'){
    var w=r._w;
    if(w.length<q.toks.length) return {ok:false, needles:[]};
    var need=[];
    for(var i=0;i<q.toks.length;i++){
      if(/^[0-9]+$/.test(q.toks[i])) continue;
      if(w[i]!==q.toks[i].toLowerCase()) return {ok:false, needles:[]};
      need.push(q.toks[i]);
    }
    return {ok:true, needles:need};
  }
  var needles=[], T=q.terms;
  for(var j=0;j<T.length;j++){
    var t=T[j];
    if(t.k==='len'){ if(r._len<t.a||r._len>t.b) return {ok:false,needles:[]}; continue; }
    if(t.k==='wc'){  if(r._wc <t.a||r._wc >t.b) return {ok:false,needles:[]}; continue; }
    if(t.k==='nrange'){ if(r.no<t.a||r.no>t.b) return {ok:false,needles:[]}; continue; }
    if(t.k==='miss'){ var mc=r._miss||0; if(mc<t.a||mc>t.b) return {ok:false,needles:[]}; continue; }
    if(t.k==='word'){ if(r._w.indexOf(t.v)<0) return {ok:false,needles:[]}; needles.push(t.v); continue; }
    if(t.k==='pre'){
      if(!(anyStarts(r._v,t.v) || r._jp.lastIndexOf(t.v,0)===0)) return {ok:false,needles:[]};
      needles.push(t.v); continue;
    }
    if(t.k==='suf'){
      if(!(anyEnds(r._v,t.v) || anyEnds([r._jp],t.v))) return {ok:false,needles:[]};
      needles.push(t.v); continue;
    }
    if(t.k==='has'){
      if(r._en.indexOf(t.v)<0 && r._jp.indexOf(t.v)<0) return {ok:false,needles:[]};
      needles.push(t.v); continue;
    }
  }
  return {ok:true, needles:needles};
}

function hlMulti(text, needles){
  var arr=[]; for(var i=0;i<needles.length;i++) if(needles[i]) arr.push(escRe(needles[i]));
  if(!arr.length) return esc(text);
  arr.sort(function(a,b){return b.length-a.length;});
  var re; try{ re=new RegExp('('+arr.join('|')+')','gi'); }catch(e){ return esc(text); }
  var out='', last=0, m;
  while((m=re.exec(text))!==null){
    out+=esc(text.slice(last,m.index))+'<mark>'+esc(m[0])+'</mark>';
    last=m.index+m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  return out+esc(text.slice(last));
}

/* ===================== 隠す（赤シート） =====================
   HIDE.jp/en … 訳・英語をすべて隠す / HIDE.part … 自分で選んだ部分を隠す
   masks[id] = {en:{t:その時の英語, r:[[開始,終了],...]}, jp:{...}}
   （文字の位置で覚えるので、あとで文章が変わった場合はその指定は使わない） */
/* ===================== 意味を ①② に分ける（速読英熟語） =====================
   区切り＝カッコの外にあるスペース（データ上、カッコの中にスペースは無い）。
   すでに①②の形でも、番号と改行を外してから分け直すので、何度押しても同じ結果になる */
var CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function splitMeanings(jp){
  var s=String(jp).replace(/^[ \t　]*[①-⑳][ \t　]*/gm,'').replace(/\r?\n+/g,' ');
  var OPEN='（(〔[【「『', CLOSE='）)〕]】」』', parts=[], cur='', d=0;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i);
    if(OPEN.indexOf(ch)>=0) d++;
    else if(CLOSE.indexOf(ch)>=0) d=Math.max(0,d-1);
    if((ch===' '||ch==='　') && d===0){ if(cur.trim()) parts.push(cur.trim()); cur=''; }
    else cur+=ch;
  }
  if(cur.trim()) parts.push(cur.trim());
  return parts;
}
function numberMeanings(jp){
  var p=splitMeanings(jp);
  if(p.length<2) return null;
  return p.map(function(x,i){ return (i<20 ? CIRC.charAt(i) : '('+(i+1)+')')+x; }).join('\n');
}
function applyNumbering(){
  var ta=document.getElementById('edjp'); if(!ta) return {changed:false, msg:''};
  var out=numberMeanings(ta.value);
  if(out===null) return {changed:false, msg:'意味が1つなので分けられません'};
  if(out===ta.value) return {changed:false, msg:'すでにこの形です'};
  ta.value=out; flushEdit();
  return {changed:true, msg:'①②の形にしました（「訳を元に戻す」で戻せます）'};
}

function markFlags(text, needles){
  var n=text.length, f=new Array(n), i;
  for(i=0;i<n;i++) f[i]=0;
  var arr=[]; for(i=0;i<needles.length;i++) if(needles[i]) arr.push(escRe(needles[i]));
  if(!arr.length) return f;
  arr.sort(function(a,b){ return b.length-a.length; });
  var re; try{ re=new RegExp('('+arr.join('|')+')','gi'); }catch(e){ return f; }
  var m;
  while((m=re.exec(text))!==null){
    for(var j=m.index;j<m.index+m[0].length;j++) f[j]=1;
    if(m[0].length===0) re.lastIndex++;
  }
  return f;
}
/* 検索の強調(mark)と隠す部分(hid)を同時に描く。隠す部分が無ければ従来どおり */
function renderText(text, needles, ranges, kp){
  text=String(text); needles=needles||[];
  if(!ranges || !ranges.length) return hlMulti(text, needles);
  var n=text.length, mk=markFlags(text, needles), hd=new Array(n), i, j;
  for(i=0;i<n;i++) hd[i]=-1;
  for(var q=0;q<ranges.length;q++){
    var a=Math.max(0, ranges[q][0]|0), b=Math.min(n, ranges[q][1]|0);
    for(j=a;j<b;j++) hd[j]=q;
  }
  var out=''; i=0;
  while(i<n){
    var h=hd[i]; j=i; while(j<n && hd[j]===h) j++;
    var inner='', p=i;
    while(p<j){ var mm=mk[p], z=p; while(z<j && mk[z]===mm) z++;
      var seg=esc(text.slice(p,z)); inner+= mm ? '<mark>'+seg+'</mark>' : seg; p=z; }
    if(h>=0){ var k=kp+'|'+h;
      out+='<span class="hid'+(REVEAL[k]?' rv':'')+'" data-act="peek" data-k="'+k+'">'+inner+'</span>'; }
    else out+=inner;
    i=j;
  }
  return out;
}
function togglePeek(el){

function rangesFromBools(b){
  var out=[], i=0, n=b.length;
  while(i<n){ if(b[i]){ var j=i; while(j<n && b[j]) j++; out.push([i,j]); i=j; } else i++; }
  return out;
}
function boolsFromRanges(rs, n){
  var b=new Array(n), i; for(i=0;i<n;i++) b[i]=false;
  (rs||[]).forEach(function(r){ for(var j=Math.max(0,r[0]); j<Math.min(n,r[1]); j++) b[j]=true; });
  return b;
}
/* 隠す場所を選ぶ画面の区切り方：単語ごと / 1文字ずつ */
function maskTokens(text, mode, f){
  var out=[], i;
  if(mode==='char'){
    for(i=0;i<text.length;i++){ var c=text.charAt(i); out.push({s:i, e:i+1, txt:c, sp:/\s/.test(c)}); }
    return out;
  }
  var re = (f==='en') ? /\s+/g : /[\s、，,・／\/\u2460-\u2473]+/g, last=0, m;
  while((m=re.exec(text))!==null){
    if(m.index>last) out.push({s:last, e:m.index, txt:text.slice(last,m.index), sp:false});
    out.push({s:m.index, e:m.index+m[0].length, txt:m[0], sp:true});
    last=m.index+m[0].length;
    if(m[0].length===0) re.lastIndex++;
  }
  if(last<text.length) out.push({s:last, e:text.length, txt:text.slice(last), sp:false});
  return out;
}

/* タップ＝1つ、なぞる＝範囲。指でもマウスでも */
function meAttach(root, onChange){
  var drag=null;
  function tok(el){ while(el && el!==root && !(el.classList && el.classList.contains('mt'))) el=el.parentNode;
    return (el && el!==root) ? el : null; }
  function paint(){
    var els=root.querySelectorAll('.mt');
    for(var i=0;i<els.length;i++){ var e=els[i];
      var inR=!!drag && e.getAttribute('data-f')===drag.f && (+e.getAttribute('data-s'))>=drag.a && (+e.getAttribute('data-e'))<=drag.b;
      e.classList.toggle('drag', inR); }
  }
  function start(el){ drag={f:el.getAttribute('data-f'), s0:+el.getAttribute('data-s'), e0:+el.getAttribute('data-e')};
    drag.a=drag.s0; drag.b=drag.e0; paint(); }
  function move(x,y){
    if(!drag) return;
    var el=tok(document.elementFromPoint(x,y));
    if(!el || el.getAttribute('data-f')!==drag.f) return;
    drag.a=Math.min(drag.s0, +el.getAttribute('data-s')); drag.b=Math.max(drag.e0, +el.getAttribute('data-e')); paint();
  }
  function end(){ if(!drag) return; var d=drag; drag=null; meToggle(d.f, d.a, d.b); onChange(); }
  root.addEventListener('touchstart', function(e){ var el=tok(e.target); if(!el) return; e.preventDefault(); start(el); }, {passive:false});
  root.addEventListener('touchmove', function(e){ if(!drag) return; e.preventDefault(); var p=e.touches[0]; move(p.clientX, p.clientY); }, {passive:false});
  root.addEventListener('touchend', function(e){ if(!drag) return; e.preventDefault(); end(); }, {passive:false});
  root.addEventListener('touchcancel', function(){ drag=null; paint(); });
  root.addEventListener('mousedown', function(e){ var el=tok(e.target); if(!el) return; e.preventDefault(); start(el); });
  document.addEventListener('mousemove', function(e){ if(drag) move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', function(){ end(); });
}

  if(!a.length) delete gm[e]; }

/* 並び順・親子関係は1回だけ計算して使い回す。

var COLL=(window.Intl && Intl.Collator) ? new Intl.Collator('ja') : null;
function cmpName(a,b){ return COLL ? COLL.compare(a.name,b.name) : (a.name<b.name?-1:(a.name>b.name?1:0)); }
var GIDX=null;
function gidx(){
  if(GIDX) return GIDX;
  var kids={}, byId={}, i;
  for(i=0;i<groups.length;i++){ var g=groups[i]; byId[g.id]=g; var pp=g.p||''; (kids[pp]=kids[pp]||[]).push(g); }
  for(var k in kids) kids[k].sort(cmpName);
  var order=[], seen={};
  (function walk(pid, depth){
    var arr=kids[pid]||[];
    for(var j=0;j<arr.length;j++){ var g=arr[j]; if(seen[g.id]||depth>8) continue;
      seen[g.id]=1; g._d=depth; order.push(g); walk(g.id, depth+1); }
  })('', 0);
  for(i=0;i<groups.length;i++) if(!seen[groups[i].id]){ groups[i]._d=0; order.push(groups[i]); }
  var desc={};
  function collect(gid){
    if(desc[gid]) return desc[gid];
    var acc=[]; desc[gid]=acc;
    var arr=kids[gid]||[];
    for(var j=0;j<arr.length;j++){ acc.push(arr[j].id); var sub=collect(arr[j].id);
      for(var q=0;q<sub.length;q++) acc.push(sub[q]); }
    return acc;

  return GIDX;
}

  if(GS) return GS;

  for(i=0;i<groups.length;i++){ own[groups[i].id]=0; members[groups[i].id]={}; }
  for(var k in gm){ var a=gm[k]||[];
    for(i=0;i<a.length;i++) if(members[a[i]]){ members[a[i]][k]=1; own[a[i]]++; } }
  var tot={};
  for(i=0;i<groups.length;i++){
    var g=groups[i], set={}, list=[g.id].concat(descendantsOf(g.id));
    for(var j=0;j<list.length;j++){ var m=members[list[j]]||{}; for(var e in m) set[e]=1; }
    tot[g.id]=Object.keys(set).length;

/* ================= 発音（iPhone内蔵の読み上げ音声） =================
   Google翻訳の音声はiOSでは音量を変えられない（外部音声の音量はアプリから変更不可）ため、
   音量・速さ・声を指定できる端末内蔵の読み上げ(speechSynthesis)を使う。ネット不要。 */
var HAS_TTS=(KIND==='sys') && ('speechSynthesis' in window);
var SPK_SVG='<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M3 10v4h4l5 4V6L7 10H3zm13.5 2a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
var TTS={vol:1, rate:0.9, voice:''};
try{ var _t=JSON.parse(lsGet('tts','null'));
  if(_t){ if(typeof _t.vol==='number') TTS.vol=_t.vol; if(typeof _t.rate==='number') TTS.rate=_t.rate;
          if(typeof _t.voice==='string') TTS.voice=_t.voice; } }catch(e){}
function toast(msg){
  var el=document.getElementById('toast'); if(!el){ alert(msg); return; }
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){ el.classList.remove('show'); }, 4000);
}
function saveTts(){ try{ localStorage.setItem(NS+'.tts', JSON.stringify(TTS)); }catch(e){} }
function ttsVoices(){
  if(!window.speechSynthesis) return [];
  return speechSynthesis.getVoices().filter(function(v){ return /^en([-_]|$)/i.test(v.lang); });
}
function pickVoice(){
  var vs=ttsVoices(), i;
  if(!vs.length) return null;
  if(TTS.voice) for(i=0;i<vs.length;i++) if(vs[i].voiceURI===TTS.voice) return vs[i];
  for(i=0;i<vs.length;i++) if(/^en[-_]US/i.test(vs[i].lang) && vs[i]['default']) return vs[i];
  for(i=0;i<vs.length;i++) if(/^en[-_]US/i.test(vs[i].lang)) return vs[i];
  return vs[0];
}
/* 読み上げ用に記号を外す（自作の単語向け。本の2027語はもともと記号なし） */
function speakText(s){
  return String(s).replace(/[〔（(\[【][^〕）)\]】]*[〕）)\]】]/g,' ')
                  .replace(/[～~…]/g,' ').replace(/\.\.\./g,' ').replace(/\s+/g,' ').trim();
}
var speakingBtn=null;
var NO_EN_MSG='英語の読み上げ音声が見つかりません。設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 英語 から追加してください';
function speak(text, btn){
  if(!window.speechSynthesis){ toast('この端末では読み上げが使えません'); return; }
  var t=speakText(text); if(!t) return;
  var all=speechSynthesis.getVoices()||[], v=pickVoice();
  /* 英語の声が無い端末で読ませると、日本語の声がカタカナ英語で読んでしまう（発音が大きく違う）。
     その場合は読まずに案内する。声の一覧がまだ空＝読み込み中のときは、言語(en-US)の指定で端末に任せる */
  if(all.length && !v){ toast(NO_EN_MSG); return; }
  var u=new SpeechSynthesisUtterance(t);
  u.lang=v?v.lang:'en-US';
  if(v){ try{ u.voice=v; }catch(e){ u.lang='en-US'; } }   /* 万一声を指定できなくても英語指定で読む */
  u.volume=Math.max(0, Math.min(1, TTS.vol));
  u.rate=Math.max(0.5, Math.min(1.5, TTS.rate));
  if(speakingBtn) speakingBtn.classList.remove('on');
  if(btn && btn.classList){ btn.classList.add('on'); speakingBtn=btn; }
  u.onend=u.onerror=function(){ if(btn && btn.classList) btn.classList.remove('on'); if(speakingBtn===btn) speakingBtn=null; };
  /* 連打したときは前の読み上げを止めてから。iOSは止めた直後に話させると
     無視されることがあるので、そのときだけ一呼吸おく。
     待っている間に次が押されたら古い方は捨てる（常に最後に押した単語だけを読む） */
  clearTimeout(speakTimer); speakTimer=null;
  if(speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
    speakTimer=setTimeout(function(){ speakTimer=null; speechSynthesis.speak(u); }, 80);
  } else {
    speechSynthesis.speak(u);
  }
}
var speakTimer=null;

  if(speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', function(){ if(sheetMode==='tts') openTts(); });
}

function splitLine(line){
  if(line.indexOf('\t')>=0) return line.split('\t');
  var out=[],cur='',q=false;
  for(var i=0;i<line.length;i++){ var ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ out.push(cur); cur=''; } else cur+=ch; } }
  out.push(cur); return out;
}
function parsePaste(text){
  var lines=String(text).split(/\r?\n/), rows=[], seen={};
  for(var i=0;i<lines.length;i++){
    var L=lines[i]; if(!L.trim()) continue;
    var c=splitLine(L).map(function(x){ return String(x).trim(); });
    if(IS_SOKU){
      if(c.length<5) continue;
      var renban=c[0], jn=c[1], kn=c[2], en=c[3], jp=c[4];
      if(!/^[0-9]+$/.test(renban)) continue;
      var t='', no=0;
      if(/^[0-9]+$/.test(jn)){ t='熟語'; no=parseInt(jn,10); }
      else if(/^[0-9]+$/.test(kn)){ t='構文'; no=parseInt(kn,10); }
      else continue;
      if(!en) continue;
      var id=parseInt(renban,10); if(seen[id]) continue; seen[id]=1;
      rows.push({id:id, n:id, t:t, no:no, en:en, jp:jp});
    } else {
      if(c.length<3) continue;
      var mk,num,w,mn;
      if(c.length>=4){ mk=c[0]; num=c[1]; w=c[2]; mn=c[3]; }
      else { mk=''; num=c[0]; w=c[1]; mn=c[2]; }
      if(!/^[0-9]+$/.test(num) || !w) continue;
      var id2=parseInt(num,10); if(seen[id2]) continue; seen[id2]=1;
      rows.push({id:id2, no:id2, en:w, jp:mn, s:(mk==='新')?1:0});
    }
  }
  return rows;
}
function applyDataset(rows, meta, state){
  if(!rows || !rows.length){ alert('データを読み取れませんでした。列の順番をご確認ください。'); return false; }
  try{ lsSet('dataset', JSON.stringify({kind:KIND, title:TITLE, rows:rows})); }
  catch(e){ alert('保存できませんでした'); return false; }
  dsMeta={kind:KIND, title:TITLE};
  if(state){
    marks={}; (state.marks||[]).forEach(function(id){ marks[String(id)]=1; });
    miss=state.miss||{}; groups=state.groups||[]; gm=state.gm||{}; edits=state.edits||{};
    custom=state.custom||[]; customSeq=state.customSeq||0; fixSeq(); masks=state.masks||{};
    persist();
  }
  prep(rows); syncMiss(); refreshGroupSel(); updateSub(); render();
  return true;
}
function doExport(){
  var d={app:'eigo', kind:KIND, title:TITLE, ts:Date.now(),
         rows:BOOK.map(function(r){ return IS_SOKU?{id:r.id,n:r.n,t:r.t,no:r.no,en:r._oen,jp:r._ojp}
                                                  :{id:r.id,no:r.no,en:r._oen,jp:r._ojp,s:r.s}; }),
         state:payload()};
  var blob=new Blob([JSON.stringify(d)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=KIND+'-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },0);
}
function handleFile(f, wantRows){
  var rd=new FileReader();
  rd.onload=function(){
    var txt=String(rd.result), obj=null;
    try{ var m=txt.match(/=\s*(\{[\s\S]*\})\s*;?\s*$/); obj=JSON.parse(m?m[1]:txt); }catch(e){ obj=null; }
    if(obj && (obj.rows || obj.marks || obj.state)){
      var st=obj.state||((obj.marks||obj.miss||obj.groups)?obj:null);
      if(obj.kind && obj.kind!==KIND && !confirm('このファイルは「'+(obj.title||obj.kind)+'」用のようです。取り込みますか？')) return;
      if(obj.rows && obj.rows.length){ if(applyDataset(obj.rows, obj, st)) alert('取り込みました。'+obj.rows.length+'件'); }
      else if(st){ marks={}; (st.marks||[]).forEach(function(id){ marks[String(id)]=1; });
        miss=st.miss||{}; groups=st.groups||[]; gm=st.gm||{}; edits=st.edits||{};
        custom=st.custom||[]; customSeq=st.customSeq||0; fixSeq(); masks=st.masks||{};
        rebuildData(); persist(); syncMiss(); refreshGroupSel(); updateSub(); render();
        alert('記録を戻しました。★'+markCount()+'件'); }
      closeSheet(); return;
    }
    var rows=parsePaste(txt);
    if(applyDataset(rows, null, null)){ alert('取り込みました。'+rows.length+'件'); closeSheet(); }
  };
  rd.readAsText(f);
}

listEl.addEventListener('click', function(e){
  var t=e.target;
  while(t && t!==listEl && !(t.getAttribute && t.getAttribute('data-act'))) t=t.parentNode;
  if(!t || t===listEl) return;
  var act=t.getAttribute('data-act');
  if(act==='peek'){ togglePeek(t); return; }
  var cardEl=t; while(cardEl && !cardEl.getAttribute('data-id')) cardEl=cardEl.parentNode;
  if(!cardEl) return;
  var id=cardEl.getAttribute('data-id'), r=BYID[id];
  if(act==='star'){
    if(marks[id]) delete marks[id]; else marks[id]=1;
    persist();
    var on=!!marks[id]; t.textContent=on?'★':'☆'; t.classList.toggle('on',on);
    return;
  }
  if(act==='inc'||act==='dec'){
    var a=miss[id]||(miss[id]=[]);
    if(act==='inc') a.push(Date.now()); else { if(!a.length) return; a.pop(); }
    if(!a.length) delete miss[id];
    persist(); r._miss=(miss[id]||[]).length;
    /* 並び順や絞り込みに関係なく、その場で数字だけ更新（一覧を作り直さない＝位置が動かない） */
    var cnt=cardEl.querySelector('.cnt'), c=r._miss||0;
    cnt.textContent=c; cnt.classList.toggle('has',c>0);
    cardEl.querySelector('[data-act="dec"]').disabled=(c===0);
    return;
  }
  if(act==='hist'){ openHist(id); return; }
  if(act==='speak'){ speak(r.en, t); return; }
  if(act==='grp'){ openGroupPicker(id); return; }
});

ovl.addEventListener('click', function(e){
  var t=e.target; if(!t.getAttribute) return;
  var v;
  var gs=t.closest && t.closest('[data-gfsel]');
  if(gs){ pickGroupFilter(gs.getAttribute('data-gfsel')||''); return; }
  if(t.id==='edmask' && dlgId){ openMask(dlgId); return; }
  if(t.id==='ednum' && dlgId){
    var nr=applyNumbering(); if(nr.changed) openHist(dlgId);
    var nm=document.getElementById('edmsg'); if(nm) nm.textContent=nr.msg; return;
  }
  if((v=t.getAttribute('data-mm'))){ meSetMode(v); openMask(ME.id); return; }
  if((v=t.getAttribute('data-mnav'))){
    var nx=meNeighbor(filtered.map(function(x){ return x.id; }), ME.id, +v);
    if(nx!==null) openMask(nx);
    return;
  }
  if(t.getAttribute('data-mclear')){ meClear(); maskChanged(); return; }
  if(t.getAttribute('data-mon')){ HIDE.part=true; REVEAL={}; saveHide(); refreshHideChips(); listDirty=true; openMask(ME.id); return; }
  if(t.id==='edsave' && dlgId){
    if(!flushEdit()){ var m0=document.getElementById('edmsg'); if(m0) m0.textContent='保存済みです ✓'; }
    blurInputs(); return;
  }
  if(t.id==='eddel' && dlgId){ deleteCustom(dlgId); return; }
  if(t.id==='edreset' && dlgId){ flushEdit(); blurInputs(); saveEdit(dlgId, BYID[dlgId]._ojp); openHist(dlgId); return; }
  if(t.id==='edreseten' && dlgId){ flushEdit(); blurInputs(); saveEn(dlgId, BYID[dlgId]._oen); openHist(dlgId); return; }
  if((v=t.getAttribute('data-hx'))!==null && v!==undefined && dlgId){
    flushEdit();
    var a=miss[dlgId]; if(!a) return;
    a.splice(parseInt(v,10),1); if(!a.length) delete miss[dlgId];
    persist(); syncMiss(); updateCard(dlgId); openHist(dlgId); return;
  }
  if(t.getAttribute('data-hplus') && dlgId){
    flushEdit();
    (miss[dlgId]||(miss[dlgId]=[])).push(Date.now());
    persist(); syncMiss(); updateCard(dlgId); openHist(dlgId); return;
  }
  var row=t; while(row && row.getAttribute && !row.getAttribute('data-gpick')) row=row.parentNode;
  if(row && row.getAttribute && row.getAttribute('data-gpick') && gPickId){
    var gid2=row.getAttribute('data-gpick');
    var has=(gm[gPickId]||[]).indexOf(gid2)>=0;
    if(has) removeFromGroup(gPickId,gid2); else addToGroup(gPickId,gid2);
    GS=null; persist(); refreshGroupSel(); updateCard(gPickId);
    if(gFilter) listDirty=true;
    row.classList.toggle('on', !has);
    var cb=row.querySelector('.cb'); if(cb) cb.textContent=has?'':'✓';
    var lbl=row.querySelector('.gcount'); if(lbl) lbl.textContent=gLabel(gById(gid2));
    return;
  }
  if((v=t.getAttribute('data-gadd'))){
    var box=document.getElementById(v==='pick'?'gnew':(v==='mgr'?'gnew2':'gnew3'));
    var g=createGroup(box.value); if(!g) return;
    if(v==='pick' && gPickId) addToGroup(gPickId, g.id);
    if(v==='bulk') for(var i=0;i<filtered.length;i++) addToGroup(filtered[i].id, g.id);
    blurInputs();
    var keep=gPickId; afterChange();
    if(v==='pick'){ updateCard(keep); openGroupPicker(keep); } else if(v==='mgr') openGroupManager(); else openBulk();
    return;
  }
  if((v=t.getAttribute('data-badd'))){ for(var b=0;b<filtered.length;b++) addToGroup(filtered[b].id, v);
    afterChange(); openBulk(); return; }
  if((v=t.getAttribute('data-brem'))){ for(var c2=0;c2<filtered.length;c2++) removeFromGroup(filtered[c2].id, v);
    afterChange(); openBulk(); return; }
  if((v=t.getAttribute('data-gdel'))){
    var gg=gById(v); if(!gg) return;
    if(!confirm('グループ「'+gg.name+'」を消します。単語自体は消えません。')) return;
    groups=groups.filter(function(x){ return x.id!==v; });
    for(var k in gm) removeFromGroup(k, v);
    afterChange(); openGroupManager(); return;
  }
  if(t.classList.contains('gm-c')){
    var gc=gById(t.parentNode.getAttribute('data-gcol'));
    if(gc){ gc.c=parseInt(t.getAttribute('data-c'),10)||0; afterChange(); openGroupManager(); }
    return;
  }
  var m=t.getAttribute('data-m'); if(!m && t.parentNode.getAttribute) m=t.parentNode.getAttribute('data-m');
  if(m==='help'){ openHelp(); return; }
  if(m==='add'){ openAdd(); return; }
  if(m==='tts'){ openTts(); return; }
  if(m==='ttstest'){ speak('pronunciation', t); return; }
  if(m==='doadd'){ doAdd(); return; }
  if(m==='import'){ openImport(); return; }
  if(m==='export'){ doExport(); return; }
  if(m==='restore'){ openImport(); return; }
  if(m==='pickfile'){ document.getElementById('impfile').click(); return; }
  if(m==='dopaste'){
    var rows=parsePaste(document.getElementById('pastebox').value);
    if(applyDataset(rows,null,null)){ alert('取り込みました。'+rows.length+'件'); closeSheet(); }
    return;
  }
  if(m==='clearmark'){ if(!markCount()) return;
    if(confirm('マークを全部外します。よろしいですか？')){ marks={}; persist(); listDirty=true; closeSheet(); } return; }
  if(m==='clearmiss'){ if(!missTotal()) return;
    if(confirm('間違いの記録を全部消します。元に戻せません。')){ miss={}; persist(); syncMiss(); listDirty=true; closeSheet(); } return; }
});

  if(raw){ try{ var ds=JSON.parse(raw); dsMeta=ds; prep(ds.rows||[]); }catch(e){} }
  var view=null; try{ view=JSON.parse(lsGet('view','null')); }catch(e){ view=null; }
  if(view){
    qEl.value=view.q||'';
    if(view.f){ var chip=document.querySelector('.chips [data-f="'+view.f+'"]');
      if(chip){ var act=document.querySelector('.chips [data-f].active'); if(act) act.classList.remove('active');
        chip.classList.add('active'); filter=view.f; } }
    markOnly=!!view.m; markBtn.classList.toggle('active',markOnly);
    gFilter=view.g||'';
  }
  refreshGroupSel(); updateSub();
  if(!DATA.length){
    emptyEl.innerHTML='まだ単語データがありません。<br><br>右上の <b>⋯</b> から<br><b>「単語データを取り込む」</b>を選んでください。';
    emptyEl.style.display='block';
    countEl.textContent='';
    setTimeout(openImport, 400);
  } else render(view && view.id!=null ? {anchor:{id:view.id, off:view.off||0}} : null);
})();
